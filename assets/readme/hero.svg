<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">烘焙百科 Baking Encyclopedia — 先讲逻辑，再记名字</title>
  <desc id="desc">暖奶油底标题：烘焙百科，先讲逻辑，再记名字；右侧是一张变量公式卡，可颂等于开酥面团加酵母加高油脂，上方是可颂剖面的蜂窝示意。</desc>

  <rect width="1200" height="360" rx="26" fill="#faf3e8"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6f6152">用变量拆解烘焙 · BAKING, DECODED BY VARIABLES</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#3d2b1f">烘焙百科</text>
    <text x="56" y="168" font-size="23" fill="#3d2b1f">先讲逻辑，再记名字 — 变量不会骗你</text>
    <text x="56" y="204" font-size="19" fill="#6d6257">36 种烘焙品，不过是 6 个变量的不同取值。</text>
    <g id="chips" font-size="18" fill="#3d2b1f" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#e0d3bd" stroke-width="1.5"/><text x="119" y="262">36 种品类</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#e0d3bd" stroke-width="1.5"/><text x="257" y="262">6 个变量</text></g>
      <g><rect x="332" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#e0d3bd" stroke-width="1.5"/><text x="395" y="262">7 种基底</text></g>
      <g><rect x="470" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#e0d3bd" stroke-width="1.5"/><text x="545" y="262">5 种熟成</text></g>
    </g>
  </g>

  <g id="formula-card" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="800" y="48" width="340" height="264" rx="16" fill="#ffffff" stroke="#e0d3bd" stroke-width="1.5"/>
    <g id="croissant-slice" transform="translate(970 112)">
      <path d="M -84 28 Q -78 -28 0 -40 Q 78 -28 84 28 Q 44 46 0 46 Q -44 46 -84 28 Z"
            fill="#d99a4a" stroke="#8a5a24" stroke-width="2.5"/>
      <g fill="#f7e8c8" stroke="#b57a2e" stroke-width="1.5">
        <ellipse cx="-48" cy="2" rx="13" ry="10" transform="rotate(-12 -48 2)"/>
        <ellipse cx="-12" cy="-12" rx="15" ry="11" transform="rotate(8 -12 -12)"/>
        <ellipse cx="28" cy="-8" rx="12" ry="9" transform="rotate(-6 28 -8)"/>
        <ellipse cx="54" cy="10" rx="11" ry="8" transform="rotate(10 54 10)"/>
        <ellipse cx="-28" cy="22" rx="14" ry="9" transform="rotate(4 -28 22)"/>
        <ellipse cx="14" cy="20" rx="12" ry="9" transform="rotate(-8 14 20)"/>
      </g>
      <ellipse cx="-30" cy="-26" rx="22" ry="6" fill="#e8b877" opacity="0.8" transform="rotate(-10 -30 -26)"/>
    </g>
    <text x="970" y="208" font-size="26" font-weight="700" fill="#3d2b1f" text-anchor="middle">可颂 = 开酥面团</text>
    <text x="970" y="242" font-size="22" fill="#6d6257" text-anchor="middle">+ 酵母 + 高油脂</text>
    <text x="970" y="278" font-size="17" fill="#a84a3a" text-anchor="middle">三个变量一报，身份就说完了</text>
  </g>
</svg>
